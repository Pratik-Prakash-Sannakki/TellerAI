# Illustrative example, written by hand. Shows a risky step and a typed money input.
schema_version: 1
name: transfer_funds
version: 1
status: draft
description: Move money between two accounts of the same customer.
when_to_use: A caller wants to transfer a stated amount from one of the customer's accounts to another.
app:
  id: parabank
  base_url: https://parabank.parasoft.com/parabank
  vendor: Parasoft
risk_level: risky
inputs:
  - name: from_account
    type: string
    description: Account number to take the money from.
    pattern: '^[0-9]{4,10}$'
  - name: to_account
    type: string
    description: Account number to put the money in.
    pattern: '^[0-9]{4,10}$'
  - name: amount
    type: currency
    description: Amount to move, for example 20.00.
    pattern: '^\$?[0-9]+(\.[0-9]{2})?$'
outputs:
  - name: confirmation
    type: string
    description: The confirmation message shown after the transfer.
secrets: []
routes:
  - /transfer.htm
steps:
  - action: navigate
    path: /transfer.htm
    expect:
      text_present: Transfer Funds
  - action: type
    target:
      locators:
        - strategy: label
          label: 'Amount:'
          stability: medium
    value: '{{amount}}'
  - action: select
    target:
      locators:
        - strategy: label
          label: 'From account #:'
          stability: medium
    option: '{{from_account}}'
  - action: select
    target:
      locators:
        - strategy: label
          label: 'To account #:'
          stability: medium
    option: '{{to_account}}'
  - action: click
    why: The point of no return. Replay asks a human unless policy allows this amount.
    risk: risky
    amount_input: amount
    target:
      locators:
        - strategy: role
          role: button
          name: Transfer
          stability: high
  - action: extract
    target:
      locators:
        - strategy: text
          text: Transfer Complete!
          stability: medium
    save_as: confirmation
checkpoint:
  url_contains: transfer.htm
  text_present: Transfer Complete
outcome_rules:
  - when:
      text_present: Customer Login
    kind: recoverable
    action: relogin
    message: The session expired. Log in again and continue.
