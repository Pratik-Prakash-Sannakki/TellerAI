# Illustrative example, written by hand. Shows a risky step, a typed money input, and a
# primary + fallback locator (the amount field).
schema_version: 1
name: transfer_funds
version: 1
status: draft
description: >
  Move money between two accounts of the same customer. Use when a caller wants to transfer a
  stated amount from one of the customer's accounts to another.
base_url: https://parabank.parasoft.com/parabank
risk_level: risky
inputs:
  - name: from_account
    type: string
    description: Account number to take the money from.
    pattern: '^[0-9]{4,10}$'
  - name: to_account
    type: string
    description: Account number to put the money in.
    pattern: '^[0-9]{4,10}$'
  - name: amount
    type: currency
    description: Amount to move, for example 20.00.
    pattern: '^\$?[0-9]+(\.[0-9]{2})?$'
outputs:
  - name: confirmation
    type: string
    description: The confirmation message shown after the transfer.
secrets: []
steps:
  - action: navigate
    path: /transfer.htm
    expect:
      text_present: Transfer Funds
  - action: type
    target:
      primary:
        strategy: label
        label: 'Amount:'
        stability: medium
        note: The label text next to the amount box has been stable across releases we've observed.
      fallback:
        strategy: structure
        tag: input
        within:
          role: form
        nth: 1
        stability: low
        note: First input in the transfer form; only tried if the label text ever changes.
    value: '{{amount}}'
  - action: select
    target:
      primary:
        strategy: label
        label: 'From account #:'
        stability: medium
        note: Label text next to the from-account dropdown; unlikely to change independently of the field itself.
    option: '{{from_account}}'
  - action: select
    target:
      primary:
        strategy: label
        label: 'To account #:'
        stability: medium
        note: Label text next to the to-account dropdown; unlikely to change independently of the field itself.
    option: '{{to_account}}'
  - action: click
    why: The point of no return. Replay asks a human unless policy allows this amount.
    risk: risky
    amount_input: amount
    target:
      primary:
        strategy: role
        role: button
        name: Transfer
        stability: high
        note: Accessible role and name for the submit button; the most stable signal available and independent of layout.
  - action: extract
    target:
      primary:
        strategy: text
        text: Transfer Complete!
        stability: medium
        note: Confirmation heading text has been stable across runs; nothing else identifies it.
    save_as: confirmation
checkpoint:
  url_contains: transfer.htm
  text_present: Transfer Complete
outcome_rules:
  - when:
      text_present: Customer Login
    kind: recoverable
    action: relogin
    message: The session expired. Log in again and continue.
