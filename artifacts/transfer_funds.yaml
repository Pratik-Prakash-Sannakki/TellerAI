schema_version: 1
name: transfer_funds
version: 1
status: draft
description: Move a stated amount from one account to another.
base_url: https://parabank.parasoft.com/parabank
risk_level: risky
inputs:
- name: amount
  type: currency
  description: Amount to move.
  required: true
  pattern: ^\$?[0-9]+(\.[0-9]{2})?$
outputs: []
secrets: []
steps:
- why: Start page of this capability.
  action: navigate
  path: /overview.htm
- action: click
  target:
    primary:
      strategy: role
      role: link
      name: Transfer Funds
      stability: high
      note: Accessible role and name; the most stable signal we have.
  risk: safe
- action: type
  target:
    primary:
      strategy: structure
      tag: input
      within:
        role: form
      nth: 1
      stability: low
      note: Position inside its container, counting all elements of that tag; last resort only.
  value: '{{amount}}'
- why: Point of no return. A human approved it in discovery. Replay decides by policy.
  action: click
  target:
    primary:
      strategy: role
      role: button
      name: Transfer
      stability: high
      note: Accessible role and name; the most stable signal we have.
    fallback:
      strategy: structure
      tag: input
      within:
        role: form
      nth: 2
      stability: low
      note: Position inside its container, counting all elements of that tag; last resort only.
  risk: risky
  amount_input: amount
checkpoint:
  url_contains: transfer.htm
  text_present: Transfer Complete!
outcome_rules:
- when:
    text_present: Customer Login
  kind: recoverable
  action: relogin
  message: The session expired. Run the login capability again and continue.
