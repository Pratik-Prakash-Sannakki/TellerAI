schema_version: 2
name: transfer_funds_between_accounts
version: 1
description: Logs into the banking portal and transfers a specified dollar amount
  from one account to another, returning confirmation that the transfer completed
  successfully.
base_url: https://parabank.parasoft.com/parabank
viewport:
- 1280
- 800
device_scale_factor: 1.0
inputs:
- name: amount
  type: number
  description: Dollar amount to transfer between the accounts
- name: from_account
  type: string
  description: Account number to transfer funds from
- name: to_account
  type: string
  description: Account number to transfer funds to
outputs:
- name: confirmation
  type: string
  description: Transfer confirmation message
secrets:
- username
- password
steps:
- action: type
  target:
    anchor:
      label: Customer Login
      ordinal: 1
      offset:
      - 11
      - 45
    template: crops/transfer_funds_between_accounts/s0.png
  value: '{{secret:username}}'
- action: type
  target:
    anchor:
      label: Password
      ordinal: 1
      offset:
      - 41
      - 19
    template: crops/transfer_funds_between_accounts/s1.png
  value: '{{secret:password}}'
- action: click
  target:
    ocr_text:
      text: LOG IN
      ordinal: 1
    anchor:
      label: Password
      ordinal: 1
      offset:
      - 1
      - 50
    template: crops/transfer_funds_between_accounts/s2.png
  cleanup: false
- action: click
  target:
    ocr_text:
      text: Transfer Funds
      ordinal: 1
    anchor:
      label: Accounts Overview
      ordinal: 2
      offset:
      - -13
      - 22
    template: crops/transfer_funds_between_accounts/s3.png
  cleanup: false
- action: type
  target:
    anchor:
      label: 'Amount: $'
      ordinal: 1
      offset:
      - 105
      - 0
    template: crops/transfer_funds_between_accounts/s4.png
  value: '{{amount}}'
- action: select
  target:
    anchor:
      label: 'From account #'
      ordinal: 1
      offset:
      - 117
      - 0
    template: crops/transfer_funds_between_accounts/s5.png
  option: '{{from_account}}'
  index: 0
- action: select
  target:
    anchor:
      label: 'to account #'
      ordinal: 1
      offset:
      - 89
      - 0
    template: crops/transfer_funds_between_accounts/s6.png
  option: '{{to_account}}'
  index: 1
- action: click
  target:
    ocr_text:
      text: TRANSFER
      ordinal: 1
    anchor:
      label: Bill Pay.
      ordinal: 1
      offset:
      - 210
      - 5
    template: crops/transfer_funds_between_accounts/s7.png
  cleanup: false
- action: extract
  target:
    anchor:
      label: Transfer Complete!
      ordinal: 1
      offset:
      - 115
      - 34
  save_as: confirmation
- action: click
  target:
    ocr_text:
      text: Log Out
      ordinal: 1
    anchor:
      label: Request Loan
      ordinal: 1
      offset:
      - -17
      - 25
    template: crops/transfer_funds_between_accounts/s9.png
  cleanup: true
checkpoint: Transfer Complete!
