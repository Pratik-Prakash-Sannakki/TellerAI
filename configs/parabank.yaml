# ParaBank site profile. The ONLY place ParaBank lives: no ParaBank value belongs in src/.
# Loaded by cua.config.load_site("parabank") into a frozen SiteProfile.
# Secrets: env var NAMES only; the values come from .env, never from here.
name: parabank
start_url: "https://parabank.parasoft.com/parabank/"
allowed_hosts:
  - parabank.parasoft.com
secret_env:
  username: PARABANK_USERNAME
  password: PARABANK_PASSWORD
deny_words: [register, lookup, admin]   # refused outright (D33)
login_words: ["log in"]
# Assignment 3.4: the action types discovery may perform and replay may run (capability Step
# `action`s). Omit the key to allow all of them. observe / finish / ask tools are not site
# actions and are always allowed.
allowed_actions: [navigate, click, type, select, scroll, extract, extract_table]
# Account ids (a digit run at least this long, not an amount) are masked to their last digits in
# evidence, artifacts, logs and the terminal: '98765' -> '***765'.
id_min_digits: 5
id_visible_digits: 3
login_failure_texts:
  - could not be verified
  - user does not exist
  - invalid username or password
# The site says the boxes were empty: the typing missed. One more try, not a failure.
login_empty_texts:
  - please enter a username and password
# R17 taxonomy: text seen after a step -> status. First match wins; a capability's own
# `outcomes:` list replaces these. RECOVER = log in again once and retry the step.
outcomes:
  - {text: not found, status: BUSINESS_OUTCOME, meaning: the item asked for was not found}
  - {text: no such, status: BUSINESS_OUTCOME, meaning: the item asked for does not exist}
  - {text: does not exist, status: BUSINESS_OUTCOME, meaning: the item does not exist}
  - {text: insufficient funds, status: BUSINESS_OUTCOME, meaning: not enough funds}
  - {text: could not be verified, status: BUSINESS_OUTCOME, meaning: details not verified}
  - {text: session expired, status: RECOVER, meaning: the session expired}
  - {text: access denied, status: FAILED, meaning: the site denied access}
  - {text: error, status: FAILED, meaning: the site showed an error page}
