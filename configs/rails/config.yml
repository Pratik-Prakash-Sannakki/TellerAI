# NeMo Guardrails for Teller's discovery goal. Only the embeddings model is configured here; the
# decision (thresholds in thresholds.yml, Haiku fallback) lives in cua.safety.nemo. The LLM is
# injected in code (cua.llm.make_chat_model), so it is not listed here.
models:
  - type: embeddings
    engine: FastEmbed
    model: all-MiniLM-L6-v2
