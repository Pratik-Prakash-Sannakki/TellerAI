schema_version: 2
name: pay_bill_to_payee
version: 1
description: Logs into the customer account and pays a bill to a specified payee by
  transferring funds from a selected account. Returns confirmation that the bill payment
  has been completed.
base_url: https://parabank.parasoft.com/parabank
viewport:
- 1280
- 800
device_scale_factor: 1.0
inputs:
- name: payee_name
  type: string
  description: The name of the person or organization to pay
- name: amount
  type: number
  description: The dollar amount to pay
- name: address
  type: number
  description: The payee's street address
- name: city
  type: number
  description: The payee's city
- name: state
  type: number
  description: The payee's state
- name: zip_code
  type: number
  description: The payee's zip code
- name: phone
  type: number
  description: The payee's phone number
- name: account
  type: number
  description: The payee's account number
- name: verify_account
  type: number
  description: The payee's account number entered again for verification
- name: from_account
  type: string
  description: The account number to transfer funds from
outputs:
- name: confirmation
  type: string
  description: Bill payment confirmation message
secrets:
- username
- password
steps:
- action: type
  target:
    anchor:
      label: Customer Login
      ordinal: 1
      offset:
      - 7
      - 47
    template: crops/pay_bill_to_payee/s0.png
  value: '{{secret:username}}'
- action: type
  target:
    anchor:
      label: Password
      ordinal: 1
      offset:
      - 38
      - 21
    template: crops/pay_bill_to_payee/s1.png
  value: '{{secret:password}}'
- action: click
  target:
    ocr_text:
      text: LOG IN
      ordinal: 1
    anchor:
      label: Password
      ordinal: 1
      offset:
      - 1
      - 50
    template: crops/pay_bill_to_payee/s2.png
  cleanup: false
- action: click
  target:
    ocr_text:
      text: Bill Pay.
      ordinal: 1
    anchor:
      label: Transfer Funds
      ordinal: 1
      offset:
      - -20
      - 25
    template: crops/pay_bill_to_payee/s3.png
  cleanup: false
- action: type
  target:
    anchor:
      label: 'Payee Name:'
      ordinal: 1
      offset:
      - 148
      - 0
    template: crops/pay_bill_to_payee/s4.png
  value: '{{payee_name}}'
- action: type
  target:
    anchor:
      label: 'Amount: $'
      ordinal: 1
      offset:
      - 140
      - 0
    template: crops/pay_bill_to_payee/s5.png
  value: '{{amount}}'
- action: type
  target:
    anchor:
      label: 'Address:'
      ordinal: 1
      offset:
      - 137
      - 1
    template: crops/pay_bill_to_payee/s6.png
  value: '{{address}}'
- action: type
  target:
    anchor:
      label: 'City:'
      ordinal: 1
      offset:
      - 122
      - -1
    template: crops/pay_bill_to_payee/s7.png
  value: '{{city}}'
- action: type
  target:
    anchor:
      label: 'State:'
      ordinal: 1
      offset:
      - 126
      - 0
    template: crops/pay_bill_to_payee/s8.png
  value: '{{state}}'
- action: type
  target:
    anchor:
      label: 'Zip Code:'
      ordinal: 1
      offset:
      - 138
      - 0
    template: crops/pay_bill_to_payee/s9.png
  value: '{{zip_code}}'
- action: type
  target:
    anchor:
      label: 'Phone #:'
      ordinal: 1
      offset:
      - 137
      - 0
    template: crops/pay_bill_to_payee/s10.png
  value: '{{phone}}'
- action: type
  target:
    anchor:
      label: 'Account #:'
      ordinal: 1
      offset:
      - 142
      - 1
    template: crops/pay_bill_to_payee/s11.png
  value: '{{account}}'
- action: type
  target:
    anchor:
      label: 'Verify Account #:'
      ordinal: 1
      offset:
      - 161
      - 0
    template: crops/pay_bill_to_payee/s12.png
  value: '{{verify_account}}'
- action: select
  target:
    anchor:
      label: 'From account #:'
      ordinal: 1
      offset:
      - 126
      - 1
    template: crops/pay_bill_to_payee/s13.png
  option: '{{from_account}}'
  index: 0
- action: click
  target:
    ocr_text:
      text: SEND PAYMENT
      ordinal: 1
    anchor:
      label: 'From account #:'
      ordinal: 1
      offset:
      - 109
      - 24
    template: crops/pay_bill_to_payee/s14.png
  cleanup: false
- action: extract
  target:
    anchor:
      label: Bill Payment Complete
      ordinal: 1
      offset:
      - 143
      - 34
  save_as: confirmation
- action: click
  target:
    ocr_text:
      text: Log Out
      ordinal: 1
    anchor:
      label: Request Loan
      ordinal: 1
      offset:
      - -17
      - 25
    template: crops/pay_bill_to_payee/s16.png
  cleanup: true
checkpoint: Bill Payment Complete
