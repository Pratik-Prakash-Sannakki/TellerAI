schema_version: 2
name: get_transfer_account_options
version: 1
description: Logs into the online banking portal and navigates to the transfer funds
  section to retrieve the available "from" account options for paying a bill. Returns
  a list of eligible source accounts that can be used for the transfer.
base_url: https://parabank.parasoft.com/parabank
viewport:
- 1280
- 800
device_scale_factor: 1.0
inputs: []
outputs:
- name: from_account_options
  type: options
  description: Options for the From account dropdown
secrets:
- username
- password
steps:
- action: type
  target:
    anchor:
      label: Customer Login
      ordinal: 1
      offset:
      - 10
      - 46
    template: crops/get_transfer_account_options/s0.png
  value: '{{secret:username}}'
- action: type
  target:
    anchor:
      label: Password
      ordinal: 1
      offset:
      - 40
      - 19
    template: crops/get_transfer_account_options/s1.png
  value: '{{secret:password}}'
- action: click
  target:
    ocr_text:
      text: LOG IN
      ordinal: 1
    anchor:
      label: Password
      ordinal: 1
      offset:
      - 1
      - 50
    template: crops/get_transfer_account_options/s2.png
  cleanup: false
- action: click
  target:
    ocr_text:
      text: Bill Pay.
      ordinal: 1
    anchor:
      label: Transfer Funds
      ordinal: 1
      offset:
      - -22
      - 24
    template: crops/get_transfer_account_options/s3.png
  cleanup: false
- action: extract_options
  target:
    anchor:
      label: 'From account #:'
      ordinal: 1
      offset:
      - 76
      - 0
    template: crops/get_transfer_account_options/s4.png
  save_as: from_account_options
  index: 0
- action: click
  target:
    ocr_text:
      text: Log Out
      ordinal: 1
    anchor:
      label: Request Loan
      ordinal: 1
      offset:
      - -18
      - 24
    template: crops/get_transfer_account_options/s5.png
  cleanup: true
checkpoint: 'City:'
