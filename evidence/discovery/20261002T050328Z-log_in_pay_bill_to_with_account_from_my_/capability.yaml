schema_version: 2
name: pay_bill_to_payee
version: 1
description: Logs into the online banking account and submits a bill payment to a
  specified payee from a chosen account, returning confirmation that the payment was
  completed.
base_url: https://parabank.parasoft.com/parabank
viewport:
- 1280
- 800
device_scale_factor: 1.0
inputs:
- name: payee_name
  type: string
  description: Name of the payee to pay the bill to
- name: account
  type: number
  description: Payee's account number to pay into
- name: verify_account
  type: number
  description: Re-entry of the payee's account number for verification
- name: amount
  type: number
  description: Dollar amount to pay
- name: from_account
  type: number
  description: Account number to pay from
- name: address
  type: number
  description: Payee's street address
- name: city
  type: number
  description: Payee's city
- name: state
  type: number
  description: Payee's state
- name: zip_code
  type: number
  description: Payee's zip code
- name: phone
  type: number
  description: Payee's phone number
outputs:
- name: confirmation
  type: string
  description: Bill payment confirmation message
secrets:
- username
- password
steps:
- action: type
  target:
    anchor:
      label: Customer Login
      ordinal: 1
      offset:
      - 10
      - 46
    template: crops/pay_bill_to_payee/s0.png
  value: '{{secret:username}}'
- action: type
  target:
    anchor:
      label: Password
      ordinal: 1
      offset:
      - 40
      - 20
    template: crops/pay_bill_to_payee/s1.png
  value: '{{secret:password}}'
- action: click
  target:
    ocr_text:
      text: LOG IN
      ordinal: 1
    anchor:
      label: Password
      ordinal: 1
      offset:
      - 1
      - 50
    template: crops/pay_bill_to_payee/s2.png
  cleanup: false
- action: click
  target:
    ocr_text:
      text: Bill Pay.
      ordinal: 1
    anchor:
      label: Transfer Funds
      ordinal: 1
      offset:
      - -21
      - 25
    template: crops/pay_bill_to_payee/s3.png
  cleanup: false
- action: type
  target:
    anchor:
      label: 'Payee Name:'
      ordinal: 1
      offset:
      - 149
      - 0
    template: crops/pay_bill_to_payee/s4.png
  value: '{{payee_name}}'
- action: type
  target:
    anchor:
      label: 'Account #:'
      ordinal: 1
      offset:
      - 142
      - 1
    template: crops/pay_bill_to_payee/s5.png
  value: '{{account}}'
- action: type
  target:
    anchor:
      label: 'Verify Account #:'
      ordinal: 1
      offset:
      - 161
      - 1
    template: crops/pay_bill_to_payee/s6.png
  value: '{{verify_account}}'
- action: type
  target:
    anchor:
      label: 'Amount: $'
      ordinal: 1
      offset:
      - 140
      - 0
    template: crops/pay_bill_to_payee/s7.png
  value: '{{amount}}'
- action: select
  target:
    anchor:
      label: 'From account #:'
      ordinal: 1
      offset:
      - 125
      - 0
    template: crops/pay_bill_to_payee/s8.png
  option: '{{from_account}}'
  index: 0
- action: type
  target:
    anchor:
      label: 'Address:'
      ordinal: 1
      offset:
      - 137
      - 2
    template: crops/pay_bill_to_payee/s9.png
  value: '{{address}}'
- action: type
  target:
    anchor:
      label: 'City:'
      ordinal: 1
      offset:
      - 122
      - 0
    template: crops/pay_bill_to_payee/s10.png
  value: '{{city}}'
- action: type
  target:
    anchor:
      label: 'State:'
      ordinal: 1
      offset:
      - 126
      - 0
    template: crops/pay_bill_to_payee/s11.png
  value: '{{state}}'
- action: type
  target:
    anchor:
      label: 'Zip Code:'
      ordinal: 1
      offset:
      - 138
      - 1
    template: crops/pay_bill_to_payee/s12.png
  value: '{{zip_code}}'
- action: type
  target:
    anchor:
      label: 'Phone #:'
      ordinal: 1
      offset:
      - 137
      - 1
    template: crops/pay_bill_to_payee/s13.png
  value: '{{phone}}'
- action: click
  target:
    ocr_text:
      text: SEND PAYMENT
      ordinal: 1
    anchor:
      label: 'From account #:'
      ordinal: 1
      offset:
      - 109
      - 24
    template: crops/pay_bill_to_payee/s14.png
  cleanup: false
- action: extract
  target:
    anchor:
      label: Bill Payment Complete
      ordinal: 1
      offset:
      - 143
      - 34
  save_as: confirmation
- action: click
  target:
    ocr_text:
      text: Log Out
      ordinal: 1
    anchor:
      label: Request Loan
      ordinal: 1
      offset:
      - -17
      - 25
    template: crops/pay_bill_to_payee/s16.png
  cleanup: true
checkpoint: Bill Payment Complete
