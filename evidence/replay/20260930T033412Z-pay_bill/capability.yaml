schema_version: 2
name: pay_bill
version: 1
description: Logs into the account and initiates a bill payment by entering payee
  information and transfer details.
base_url: https://parabank.parasoft.com/parabank
viewport:
- 1280
- 800
device_scale_factor: 1.0
inputs:
- name: payee_name
  type: string
  description: The name of the payee to whom the bill payment is being made
- name: address
  type: string
  description: The street address of the payee
- name: city
  type: string
  description: The city where the payee is located
- name: state
  type: string
  description: The state where the payee is located
- name: zip_code
  type: string
  description: The ZIP code of the payee's address
- name: phone
  type: string
  description: The phone number of the payee
- name: account
  type: string
  description: The account number for the bill payment
- name: verify_account
  type: string
  description: The account number entered again for verification
- name: amount
  type: string
  description: The payment amount to be transferred
- name: from_account
  type: string
  description: The account number from which funds will be transferred
outputs: []
secrets:
- username
- password
steps:
- action: type
  target:
    anchor:
      label: Customer Login
      ordinal: 1
      offset:
      - 12
      - 45
    template: crops/pay_bill/s0.png
  value: '{{secret:username}}'
- action: type
  target:
    anchor:
      label: Password
      ordinal: 1
      offset:
      - 41
      - 19
    template: crops/pay_bill/s1.png
  value: '{{secret:password}}'
- action: click
  target:
    ocr_text:
      text: LOG IN
      ordinal: 1
    anchor:
      label: Password
      ordinal: 1
      offset:
      - 1
      - 50
    template: crops/pay_bill/s2.png
- action: click
  target:
    ocr_text:
      text: Bill Pay.
      ordinal: 1
    anchor:
      label: Transfer Funds
      ordinal: 1
      offset:
      - -20
      - 25
    template: crops/pay_bill/s3.png
- action: type
  target:
    anchor:
      label: 'Payee Name:'
      ordinal: 1
      offset:
      - 149
      - 1
    template: crops/pay_bill/s4.png
  value: '{{payee_name}}'
- action: type
  target:
    anchor:
      label: 'Address:'
      ordinal: 1
      offset:
      - 137
      - 1
    template: crops/pay_bill/s5.png
  value: '{{address}}'
- action: type
  target:
    anchor:
      label: 'City:'
      ordinal: 1
      offset:
      - 122
      - 0
    template: crops/pay_bill/s6.png
  value: '{{city}}'
- action: type
  target:
    anchor:
      label: 'State:'
      ordinal: 1
      offset:
      - 126
      - 0
    template: crops/pay_bill/s7.png
  value: '{{state}}'
- action: type
  target:
    anchor:
      label: 'Zip Code:'
      ordinal: 1
      offset:
      - 138
      - 0
    template: crops/pay_bill/s8.png
  value: '{{zip_code}}'
- action: type
  target:
    anchor:
      label: 'Phone #:'
      ordinal: 1
      offset:
      - 137
      - 0
    template: crops/pay_bill/s9.png
  value: '{{phone}}'
- action: type
  target:
    anchor:
      label: 'Account #:'
      ordinal: 1
      offset:
      - 142
      - 1
    template: crops/pay_bill/s10.png
  value: '{{account}}'
- action: type
  target:
    anchor:
      label: 'Verify Account #:'
      ordinal: 1
      offset:
      - 161
      - 0
    template: crops/pay_bill/s11.png
  value: '{{verify_account}}'
- action: type
  target:
    anchor:
      label: 'Amount: $'
      ordinal: 1
      offset:
      - 140
      - 0
    template: crops/pay_bill/s12.png
  value: '{{amount}}'
- action: select
  target:
    anchor:
      label: 'From account #:'
      ordinal: 1
      offset:
      - 124
      - 0
    template: crops/pay_bill/s13.png
  option: '{{from_account}}'
- action: click
  target:
    ocr_text:
      text: SEND PAYMENT
      ordinal: 1
    anchor:
      label: 'From account #:'
      ordinal: 1
      offset:
      - 111
      - 25
    template: crops/pay_bill/s14.png
checkpoint: Bill Payment Complete
