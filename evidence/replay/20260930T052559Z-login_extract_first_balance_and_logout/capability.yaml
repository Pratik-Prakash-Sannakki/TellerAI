schema_version: 2
name: login_extract_first_balance_and_logout
version: 1
description: Logs into the account, extracts the first account balance, and logs out.
base_url: https://parabank.parasoft.com/parabank
viewport:
- 1280
- 800
device_scale_factor: 1.0
inputs: []
outputs:
- name: first_balance
  type: currency
  description: First account balance from Accounts Overview
secrets:
- username
- password
steps:
- action: type
  target:
    anchor:
      label: Customer Login
      ordinal: 1
      offset:
      - 11
      - 42
    template: crops/login_extract_first_balance_and_logout/s0.png
  value: '{{secret:username}}'
- action: type
  target:
    anchor:
      label: Password
      ordinal: 1
      offset:
      - 41
      - 16
    template: crops/login_extract_first_balance_and_logout/s1.png
  value: '{{secret:password}}'
- action: click
  target:
    ocr_text:
      text: LOG IN
      ordinal: 1
    anchor:
      label: Password
      ordinal: 1
      offset:
      - 1
      - 50
    template: crops/login_extract_first_balance_and_logout/s2.png
  cleanup: false
- action: extract
  target:
    table_cell:
      row_key: Transfer Funds
      column: Accounts Overview
  save_as: first_balance
- action: click
  target:
    ocr_text:
      text: Log Out
      ordinal: 1
    anchor:
      label: Request Loan
      ordinal: 1
      offset:
      - -17
      - 25
    template: crops/login_extract_first_balance_and_logout/s4.png
  cleanup: true
checkpoint: Balance*
