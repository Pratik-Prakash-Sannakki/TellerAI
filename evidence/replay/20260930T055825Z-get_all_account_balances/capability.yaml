schema_version: 2
name: get_all_account_balances
version: 1
description: Logs into a customer account and retrieves the balance information for
  all accounts.
base_url: https://parabank.parasoft.com/parabank
viewport:
- 1280
- 800
device_scale_factor: 1.0
inputs: []
outputs:
- name: account_number
  type: string
  description: Account number
- name: account_balance
  type: currency
  description: Account balance
- name: available_amount
  type: currency
  description: Available amount in account
secrets:
- username
- password
steps:
- action: type
  target:
    anchor:
      label: Customer Login
      ordinal: 1
      offset:
      - 10
      - 42
    template: crops/get_all_account_balances/s0.png
  value: '{{secret:username}}'
- action: type
  target:
    anchor:
      label: Password
      ordinal: 1
      offset:
      - 40
      - 16
    template: crops/get_all_account_balances/s1.png
  value: '{{secret:password}}'
- action: click
  target:
    ocr_text:
      text: LOG IN
      ordinal: 1
    anchor:
      label: Password
      ordinal: 1
      offset:
      - 1
      - 50
    template: crops/get_all_account_balances/s2.png
  cleanup: false
- action: scroll
  direction: down
- action: scroll
  direction: down
- action: extract
  target:
    anchor:
      label: Accounts Overview
      ordinal: 1
      offset:
      - -62
      - 69
  save_as: account_number
- action: extract
  target:
    anchor:
      label: Accounts Overview
      ordinal: 1
      offset:
      - 63
      - 69
  save_as: account_balance
- action: extract
  target:
    anchor:
      label: Available Amount
      ordinal: 1
      offset:
      - -31
      - 27
  save_as: available_amount
- action: click
  target:
    ocr_text:
      text: Log Out
      ordinal: 1
    anchor:
      label: Request Loan
      ordinal: 1
      offset:
      - -17
      - 25
    template: crops/get_all_account_balances/s8.png
  cleanup: true
checkpoint: Available Amount
