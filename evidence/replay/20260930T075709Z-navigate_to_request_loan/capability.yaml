schema_version: 2
name: navigate_to_request_loan
version: 1
description: Navigate through the ParaSoft Demo Website to reach the Request Loan
  page after logging in.
base_url: https://parabank.parasoft.com/parabank
viewport:
- 1280
- 800
device_scale_factor: 1.0
inputs: []
outputs:
- name: bank_phone_number
  type: string
  description: Bank phone number
secrets:
- username
- password
steps:
- action: type
  target:
    anchor:
      label: Customer Login
      ordinal: 1
      offset:
      - 11
      - 42
    template: crops/navigate_to_request_loan/s0.png
  value: '{{secret:username}}'
- action: type
  target:
    anchor:
      label: Password
      ordinal: 1
      offset:
      - 41
      - 16
    template: crops/navigate_to_request_loan/s1.png
  value: '{{secret:password}}'
- action: click
  target:
    ocr_text:
      text: LOG IN
      ordinal: 1
    anchor:
      label: Password
      ordinal: 1
      offset:
      - 1
      - 50
    template: crops/navigate_to_request_loan/s2.png
  cleanup: false
- action: navigate
  path: /parabank/contact.htm
- action: navigate
  path: /parabank/contact.htm
- action: navigate
  path: /parabank/overview.htm
- action: navigate
  path: /index.htm
- action: click
  target:
    ocr_text:
      text: Contact Us
      ordinal: 1
    anchor:
      label: Site Map
      ordinal: 1
      offset:
      - 81
      - 0
    template: crops/navigate_to_request_loan/s7.png
  cleanup: false
- action: click
  target:
    ocr_text:
      text: About Us
      ordinal: 1
    anchor:
      label: Solutions
      ordinal: 1
      offset:
      - 0
      - 23
    template: crops/navigate_to_request_loan/s8.png
  cleanup: false
- action: extract
  target:
    table_cell:
      row_key: Find Transactions
      column: ParaSoft Demo Website
  save_as: bank_phone_number
- action: click
  target:
    ocr_text:
      text: Log Out
      ordinal: 1
    anchor:
      label: Request Loan
      ordinal: 1
      offset:
      - -16
      - 25
    template: crops/navigate_to_request_loan/s10.png
  cleanup: true
checkpoint: ParaSoft Demo Website
