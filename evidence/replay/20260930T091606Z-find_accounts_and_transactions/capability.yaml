schema_version: 2
name: find_accounts_and_transactions
version: 1
description: Logs into the customer portal and navigates through account and transaction
  information to retrieve all accounts and transactions.
base_url: https://parabank.parasoft.com/parabank
viewport:
- 1280
- 800
device_scale_factor: 1.0
inputs: []
outputs: []
secrets:
- username
- password
steps:
- action: type
  target:
    anchor:
      label: Customer Login
      ordinal: 1
      offset:
      - 10
      - 42
    template: crops/find_accounts_and_transactions/s0.png
  value: '{{secret:username}}'
- action: type
  target:
    anchor:
      label: Password
      ordinal: 1
      offset:
      - 40
      - 16
    template: crops/find_accounts_and_transactions/s1.png
  value: '{{secret:password}}'
- action: click
  target:
    ocr_text:
      text: LOG IN
      ordinal: 1
    anchor:
      label: Password
      ordinal: 1
      offset:
      - 1
      - 50
    template: crops/find_accounts_and_transactions/s2.png
  cleanup: false
- action: click
  target:
    ocr_text:
      text: Accounts Overview
      ordinal: 1
    anchor:
      label: Open New Account
      ordinal: 1
      offset:
      - -1
      - 24
    template: crops/find_accounts_and_transactions/s3.png
  cleanup: false
- action: scroll
  direction: down
- action: click
  target:
    ocr_text:
      text: Accounts Overview
      ordinal: 1
    anchor:
      label: Open New Account
      ordinal: 1
      offset:
      - 0
      - 25
    template: crops/find_accounts_and_transactions/s5.png
  cleanup: false
- action: click
  target:
    ocr_text:
      text: Log Out
      ordinal: 1
    anchor:
      label: Request Loan
      ordinal: 1
      offset:
      - -17
      - 24
    template: crops/find_accounts_and_transactions/s6.png
  cleanup: true
checkpoint: Request Loan
