schema_version: 2
name: transfer_money
version: 1
description: Transfers a specified amount of money from one account to another account
  within the banking system. This capability completes the transfer and confirms the
  transaction.
base_url: https://parabank.parasoft.com/parabank
viewport:
- 1280
- 800
device_scale_factor: 1.0
inputs:
- name: amount
  type: string
  description: The monetary amount to transfer between accounts
- name: from_account
  type: string
  description: The source account number from which funds will be withdrawn
- name: to_account
  type: string
  description: The destination account number to which funds will be deposited
outputs: []
secrets:
- username
- password
steps:
- action: type
  target:
    anchor:
      label: Customer Login
      ordinal: 1
      offset:
      - 11
      - 51
    template: crops/transfer_money/s0.png
  value: '{{secret:username}}'
- action: type
  target:
    anchor:
      label: Password
      ordinal: 1
      offset:
      - 41
      - 25
    template: crops/transfer_money/s1.png
  value: '{{secret:password}}'
- action: click
  target:
    ocr_text:
      text: LOG IN
      ordinal: 1
    anchor:
      label: Password
      ordinal: 1
      offset:
      - 1
      - 50
    template: crops/transfer_money/s2.png
  cleanup: false
- action: click
  target:
    ocr_text:
      text: Transfer Funds
      ordinal: 1
    anchor:
      label: Accounts Overview
      ordinal: 2
      offset:
      - -12
      - 23
    template: crops/transfer_money/s3.png
  cleanup: false
- action: type
  target:
    anchor:
      label: 'Amount: $'
      ordinal: 1
      offset:
      - 80
      - 0
    template: crops/transfer_money/s4.png
  value: '{{amount}}'
- action: select
  target:
    anchor:
      label: 'From account #'
      ordinal: 1
      offset:
      - 65
      - 0
    template: crops/transfer_money/s5.png
  option: '{{from_account}}'
  index: 0
- action: select
  target:
    anchor:
      label: 'to account #'
      ordinal: 1
      offset:
      - 50
      - 0
    template: crops/transfer_money/s6.png
  option: '{{to_account}}'
  index: 1
- action: click
  target:
    ocr_text:
      text: TRANSFER
      ordinal: 1
    anchor:
      label: Bill Pay.
      ordinal: 1
      offset:
      - 210
      - 4
    template: crops/transfer_money/s7.png
  cleanup: false
- action: click
  target:
    ocr_text:
      text: Log Out
      ordinal: 1
    anchor:
      label: Request Loan
      ordinal: 1
      offset:
      - -17
      - 25
    template: crops/transfer_money/s8.png
  cleanup: true
checkpoint: Transfer Complete!
