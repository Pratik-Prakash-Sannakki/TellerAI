schema_version: 2
name: get_all_account_balances
version: 1
description: Logs into the online banking portal using stored credentials and retrieves
  the balance for every account associated with the customer, returning the data as
  a table.
base_url: https://parabank.parasoft.com/parabank
viewport:
- 1280
- 800
device_scale_factor: 1.0
inputs: []
outputs:
- name: account_balances
  type: table
  description: All accounts with their balances and available amounts
  columns:
  - Account
  - Balance*
  - Available Amount
secrets:
- username
- password
steps:
- action: type
  target:
    anchor:
      label: Customer Login
      ordinal: 1
      offset:
      - 11
      - 46
    template: crops/get_all_account_balances/s0.png
  value: '{{secret:username}}'
- action: type
  target:
    anchor:
      label: Password
      ordinal: 1
      offset:
      - 41
      - 20
    template: crops/get_all_account_balances/s1.png
  value: '{{secret:password}}'
- action: click
  target:
    ocr_text:
      text: LOG IN
      ordinal: 1
    anchor:
      label: Password
      ordinal: 1
      offset:
      - 1
      - 50
    template: crops/get_all_account_balances/s2.png
  cleanup: false
- action: scroll
  direction: down
- action: scroll
  direction: up
- action: extract_table
  header:
    label: Account
    ordinal: 1
  columns:
  - Account
  - Balance*
  - Available Amount
  save_as: account_balances
  row_limit: 50
- action: click
  target:
    ocr_text:
      text: Log Out
      ordinal: 1
    anchor:
      label: Request Loan
      ordinal: 1
      offset:
      - -17
      - 25
    template: crops/get_all_account_balances/s6.png
  cleanup: true
checkpoint: Balance includes deposits
