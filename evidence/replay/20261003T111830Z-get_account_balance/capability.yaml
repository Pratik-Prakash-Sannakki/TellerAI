schema_version: 2
name: get_account_balance
version: 1
description: Logs into the online banking portal using stored credentials and retrieves
  the current account balance from the Accounts Overview page.
base_url: https://parabank.parasoft.com/parabank
viewport:
- 1280
- 800
device_scale_factor: 1.0
inputs: []
outputs:
- name: account_balance
  type: currency
  description: Account balance
secrets:
- username
- password
steps:
- action: type
  target:
    anchor:
      label: Customer Login
      ordinal: 1
      offset:
      - 11
      - 45
    template: crops/get_account_balance/s0.png
  value: '{{secret:username}}'
- action: type
  target:
    anchor:
      label: Password
      ordinal: 1
      offset:
      - 41
      - 19
    template: crops/get_account_balance/s1.png
  value: '{{secret:password}}'
- action: click
  target:
    ocr_text:
      text: LOG IN
      ordinal: 1
    anchor:
      label: Password
      ordinal: 1
      offset:
      - 1
      - 50
    template: crops/get_account_balance/s2.png
  cleanup: false
- action: extract
  target:
    anchor:
      label: Accounts Overview
      ordinal: 1
      offset:
      - 63
      - 69
  save_as: account_balance
- action: click
  target:
    ocr_text:
      text: Log Out
      ordinal: 1
    anchor:
      label: Request Loan
      ordinal: 1
      offset:
      - -17
      - 25
    template: crops/get_account_balance/s4.png
  cleanup: true
checkpoint: '*Balance includes deposits that may be subject to holds'
