schema_version: 1
name: get_account_balance
version: 1
status: draft
description: Read the current balance of one account, given its account id.
base_url: https://parabank.parasoft.com/parabank
risk_level: safe
inputs:
- name: account_id
  type: string
  description: The account number.
  required: true
  pattern: ^[0-9]{4,10}$
outputs:
- name: balance
  type: currency
  description: Balance of account {{account_id}}
secrets: []
steps:
- why: Opened directly by the agent.
  action: navigate
  path: /activity.htm?id={{account_id}}
- action: extract
  target:
    primary:
      strategy: labeled_value
      label: 'Balance:'
      stability: medium
      note: Label text is stable across releases; a labeled-value read does not depend on page position.
  save_as: balance
checkpoint:
  url_contains: activity.htm
  text_present: Account Details
outcome_rules:
- when:
    text_present: Could not find account
  kind: business
  outcome: ACCOUNT_NOT_FOUND
  message: 'Seen in a bad-input probe. The application answered: Could not find account'
