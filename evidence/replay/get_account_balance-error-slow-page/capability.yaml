schema_version: 1
name: get_account_balance
version: 1
status: draft
description: Read the total balance across all of the logged-in user's accounts, from the Accounts Overview
  page.
base_url: https://parabank.parasoft.com/parabank
risk_level: safe
inputs: []
outputs:
- name: balance
  type: currency
  description: Total balance across all accounts shown on the Accounts Overview page.
secrets: []
steps:
- why: Start page of this capability.
  action: navigate
  path: /overview.htm
- action: extract
  target:
    primary:
      strategy: labeled_value
      label: Total
      stability: medium
      note: 'The Accounts Overview table''s own footer row ("Total"), appended by the same async call
        that fills the table body, sums every account''s balance. Chosen over the column header "Balance*"
        (D89): that header''s own next-sibling cell is "Available Amount", a second header, not any account''s
        value -- always wrong, not merely ambiguous. Label text is stable across releases; a labeled-value
        read does not depend on page position.'
  save_as: balance
checkpoint:
  url_contains: overview.htm
  text_present: Accounts Overview
outcome_rules:
- when:
    text_present: Customer Login
  kind: recoverable
  action: relogin
  message: The session expired. Run the login capability again and continue.
