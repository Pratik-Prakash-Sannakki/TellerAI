schema_version: 2
name: pay_bill
version: 1
description: Logs into the account and pays a bill by entering payee information and
  transfer details.
base_url: https://parabank.parasoft.com/parabank
viewport:
- 1280
- 800
device_scale_factor: 1.0
inputs:
- name: payee_name
  type: string
  description: Name of the person or company receiving the payment
- name: address
  type: string
  description: Street address of the payee
- name: city
  type: string
  description: City of the payee
- name: state
  type: string
  description: State of the payee
- name: zip_code
  type: string
  description: Zip code of the payee
- name: phone
  type: string
  description: Phone number of the payee
- name: account
  type: string
  description: Account number to pay
- name: verify_account
  type: string
  description: Confirmation of the account number to pay
- name: amount
  type: string
  description: Dollar amount to pay
- name: from_account
  type: string
  description: Account number to transfer funds from
outputs: []
secrets:
- username
- password
steps:
- action: type
  target:
    anchor:
      label: Customer Login
      ordinal: 1
      offset:
      - 10
      - 51
    template: crops/pay_bill/s0.png
  value: '{{secret:username}}'
- action: type
  target:
    anchor:
      label: Password
      ordinal: 1
      offset:
      - 40
      - 25
    template: crops/pay_bill/s1.png
  value: '{{secret:password}}'
- action: click
  target:
    ocr_text:
      text: LOG IN
      ordinal: 1
    anchor:
      label: Password
      ordinal: 1
      offset:
      - 1
      - 50
    template: crops/pay_bill/s2.png
  cleanup: false
- action: click
  target:
    ocr_text:
      text: Bill Pay.
      ordinal: 1
    anchor:
      label: Transfer Funds
      ordinal: 1
      offset:
      - -20
      - 25
    template: crops/pay_bill/s3.png
  cleanup: false
- action: type
  target:
    anchor:
      label: 'Payee Name:'
      ordinal: 1
      offset:
      - 148
      - 0
    template: crops/pay_bill/s4.png
  value: '{{payee_name}}'
- action: type
  target:
    anchor:
      label: 'Address:'
      ordinal: 1
      offset:
      - 137
      - 0
    template: crops/pay_bill/s5.png
  value: '{{address}}'
- action: type
  target:
    anchor:
      label: 'City:'
      ordinal: 1
      offset:
      - 122
      - 0
    template: crops/pay_bill/s6.png
  value: '{{city}}'
- action: type
  target:
    anchor:
      label: 'State:'
      ordinal: 1
      offset:
      - 127
      - 1
    template: crops/pay_bill/s7.png
  value: '{{state}}'
- action: type
  target:
    anchor:
      label: 'Zip Code:'
      ordinal: 1
      offset:
      - 139
      - 0
    template: crops/pay_bill/s8.png
  value: '{{zip_code}}'
- action: type
  target:
    anchor:
      label: 'Phone #:'
      ordinal: 1
      offset:
      - 136
      - 0
    template: crops/pay_bill/s9.png
  value: '{{phone}}'
- action: type
  target:
    anchor:
      label: 'Account #:'
      ordinal: 1
      offset:
      - 142
      - 1
    template: crops/pay_bill/s10.png
  value: '{{account}}'
- action: type
  target:
    anchor:
      label: 'Verify Account #:'
      ordinal: 1
      offset:
      - 161
      - 0
    template: crops/pay_bill/s11.png
  value: '{{verify_account}}'
- action: type
  target:
    anchor:
      label: 'Amount: $'
      ordinal: 1
      offset:
      - 140
      - 1
    template: crops/pay_bill/s12.png
  value: '{{amount}}'
- action: select
  target:
    anchor:
      label: 'From account #:'
      ordinal: 1
      offset:
      - 122
      - 0
    template: crops/pay_bill/s13.png
  option: '{{from_account}}'
- action: click
  target:
    ocr_text:
      text: SEND PAYMENT
      ordinal: 1
    anchor:
      label: 'From account #:'
      ordinal: 1
      offset:
      - 110
      - 25
    template: crops/pay_bill/s14.png
  cleanup: false
- action: click
  target:
    ocr_text:
      text: Log Out
      ordinal: 1
    anchor:
      label: Request Loan
      ordinal: 1
      offset:
      - -17
      - 25
    template: crops/pay_bill/s15.png
  cleanup: true
checkpoint: Bill Payment Complete
