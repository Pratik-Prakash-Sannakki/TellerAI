schema_version: 2
name: transfer_funds
version: 1
description: Logs into a customer account and transfers a specified amount of money
  from one account to another.
base_url: https://parabank.parasoft.com/parabank
viewport:
- 1280
- 800
device_scale_factor: 1.0
inputs:
- name: amount
  type: string
  description: The dollar amount to transfer
- name: from_account
  type: string
  description: The account number to transfer funds from
- name: to_account
  type: string
  description: The account number to transfer funds to
outputs: []
secrets:
- username
- password
steps:
- action: type
  target:
    anchor:
      label: Customer Login
      ordinal: 1
      offset:
      - 11
      - 42
    template: crops/transfer_funds/s0.png
  value: '{{secret:username}}'
- action: type
  target:
    anchor:
      label: Password
      ordinal: 1
      offset:
      - 42
      - 22
    template: crops/transfer_funds/s1.png
  value: '{{secret:password}}'
- action: click
  target:
    ocr_text:
      text: LOG IN
      ordinal: 1
    anchor:
      label: Password
      ordinal: 1
      offset:
      - 1
      - 50
    template: crops/transfer_funds/s2.png
- action: click
  target:
    ocr_text:
      text: Transfer Funds
      ordinal: 1
    anchor:
      label: Accounts Overview
      ordinal: 2
      offset:
      - -13
      - 24
    template: crops/transfer_funds/s3.png
- action: type
  target:
    anchor:
      label: 'Amount: $'
      ordinal: 1
      offset:
      - 71
      - 0
    template: crops/transfer_funds/s4.png
  value: '{{amount}}'
- action: select
  target:
    anchor:
      label: 'From account #['
      ordinal: 1
      offset:
      - 64
      - 0
    template: crops/transfer_funds/s5.png
  option: '{{from_account}}'
- action: select
  target:
    anchor:
      label: ']to account #['
      ordinal: 1
      offset:
      - 68
      - 0
    template: crops/transfer_funds/s6.png
  option: '{{to_account}}'
- action: click
  target:
    ocr_text:
      text: TRANSFER
      ordinal: 1
    anchor:
      label: 'From account #'
      ordinal: 1
      offset:
      - -5
      - 38
    template: crops/transfer_funds/s7.png
checkpoint: Transfer Complete!
