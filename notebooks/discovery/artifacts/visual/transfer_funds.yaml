schema_version: 2
name: transfer_funds
version: 1
description: Logs into the customer account and transfers funds between specified
  accounts.
base_url: https://parabank.parasoft.com/parabank
viewport:
- 1280
- 800
device_scale_factor: 1.0
inputs:
- name: amount
  type: string
  description: The dollar amount to transfer between accounts
- name: from_account
  type: string
  description: The account number to transfer funds from
- name: to_account
  type: string
  description: The account number to transfer funds to
outputs: []
secrets:
- username
- password
steps:
- action: type
  target:
    anchor:
      label: Customer Login
      ordinal: 1
      offset:
      - 11
      - 46
    template: crops/transfer_funds/s0.png
  value: '{{secret:username}}'
- action: type
  target:
    anchor:
      label: Password
      ordinal: 1
      offset:
      - 41
      - 20
    template: crops/transfer_funds/s1.png
  value: '{{secret:password}}'
- action: click
  target:
    ocr_text:
      text: LOG IN
      ordinal: 1
    anchor:
      label: Password
      ordinal: 1
      offset:
      - 1
      - 50
    template: crops/transfer_funds/s2.png
  cleanup: false
- action: click
  target:
    ocr_text:
      text: Transfer Funds
      ordinal: 1
    anchor:
      label: Accounts Overview
      ordinal: 2
      offset:
      - -14
      - 23
    template: crops/transfer_funds/s3.png
  cleanup: false
- action: type
  target:
    anchor:
      label: 'Amount: $'
      ordinal: 1
      offset:
      - 121
      - -1
    template: crops/transfer_funds/s4.png
  value: '{{amount}}'
- action: select
  target:
    anchor:
      label: 'From account #'
      ordinal: 1
      offset:
      - 66
      - 0
    template: crops/transfer_funds/s5.png
  option: '{{from_account}}'
- action: select
  target:
    anchor:
      label: 'to account #'
      ordinal: 1
      offset:
      - 69
      - 0
    template: crops/transfer_funds/s6.png
  option: '{{to_account}}'
- action: click
  target:
    ocr_text:
      text: TRANSFER
      ordinal: 1
    anchor:
      label: Bill Pay.
      ordinal: 1
      offset:
      - 210
      - 4
    template: crops/transfer_funds/s7.png
  cleanup: false
- action: click
  target:
    ocr_text:
      text: Log Out
      ordinal: 1
    anchor:
      label: Request Loan
      ordinal: 1
      offset:
      - -17
      - 25
    template: crops/transfer_funds/s8.png
  cleanup: true
checkpoint: Transfer Complete!
