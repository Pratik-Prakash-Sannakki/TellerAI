[project]
name = "interface-ai-cua"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.15",
    "langchain>=1.4.2",
    "langchain-anthropic>=1.7.2",
    "numpy>=2",
    "onnxruntime>=1.30.0",
    "playwright>=1.63.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "rapidocr>=3.9.2",
]

[project.scripts]
cua = "cua.cli:main"

[project.optional-dependencies]
# TypeSafe tool selection + model routing for discovery (cua.discovery.agent.routing). Off unless
# TYPESAFE_API_KEY is set; it sends the page path + last result text to typesafe.ai.
typesafe = ["langchain-typesafe>=0.0.1a3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cua"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupytext>=1.19.5",
    "nbstripout>=0.9.1",
    "pytest>=8.0.0",
    "ruff>=0.14.0",
    "black>=25.1.0",
    "mypy>=1.14.0",
    "pytest-asyncio>=0.25.0",
    "types-PyYAML>=6.0.12",
]
# Kept empty for back-compat (`uv sync --group discovery` still works): the OCR + image deps
# (rapidocr, onnxruntime, numpy) moved to the main dependencies in step 10, so `uv pip install .`
# gets a working package.
discovery = []

[tool.pytest.ini_options]
# Scope collection to tests/ (git-ignored notebooks/scratch/ files may launch a browser on import).
testpaths = ["tests"]
asyncio_mode = "strict"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PL", "PT"]
# Notebooks are not linted here (they are not in src/ or tests/); the old ast-exec test suites in
# tests/discovery/ and tests/replay/ predate these rules and are ported, not edited, step by step
# (see docs/PRODUCTIONIZE_PLAN.md section 6: each old test file is deleted when its code is ported).
[tool.ruff.lint.per-file-ignores]
# The replay tests ported from tests/replay/ (step 9) keep their original compound assertions and
# literals verbatim (the old folder's own ignores move with them), so a port never rewrites a check.
"tests/unit/replay/test_replay_*.py" = ["E501", "PLR2004", "PT018"]
"tests/integration/test_discovery_to_replay.py" = ["E501", "PT018"]
# The system prompt is the notebook's text verbatim (its long lines are what the model reads).
"src/cua/discovery/agent/prompt.py" = ["E501"]
# test_llm.py's overrides check (`max_tokens == 123`) and its bare `pytest.raises(ValueError)`
# (the key-not-in-message check reads exc.value directly) are deliberate.
"tests/unit/test_llm.py" = ["PLR2004", "PT011"]
# ocr_engine()'s rapidocr import is deliberately local (step-2 brief): importing cua.vision must
# never load the model, so the import happens only inside the cached builder. ocr()'s zip() is
# moved verbatim from discovery.py (discovery.py:200-209); adding strict= would be a behavior
# change, not a move.
"src/cua/vision/ocr.py" = ["PLC0415", "B905"]
# like_rows is moved verbatim from discovery.py (discovery.py:1429-1435); its docstring line length
# and the "60" footer/link-text heuristic are the original source, not edited here.
"src/cua/vision/table.py" = ["E501", "PLR2004"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"

[[tool.mypy.overrides]]
# Third-party boundaries without (complete) type information; cv2 and rapidocr ship stubs/py.typed
# today, kept here so an environment with an older build still type-checks.
module = ["cv2.*", "rapidocr.*", "onnxruntime.*", "deepagents.*", "langchain_typesafe.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# LangChain's @tool decorator and middleware generics are untyped.
module = ["cua.discovery.agent.*", "cua.discovery.tools.*"]
disallow_untyped_decorators = false
