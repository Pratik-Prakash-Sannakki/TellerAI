[project]
name = "interface-ai-cua"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.15",
    "langchain>=1.4.2",
    "langchain-anthropic>=1.7.2",
    "playwright>=1.63.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cua"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupytext>=1.19.5",
    "nbstripout>=0.9.1",
    "pytest>=8.0.0",
    "ruff>=0.14.0",
    "black>=25.1.0",
    "mypy>=1.14.0",
    "pytest-asyncio>=0.25.0",
    "types-PyYAML>=6.0.12",
]
# OCR + image deps for the pure-visual discovery and replay notebooks.
discovery = [
    "rapidocr>=3.9.2",
    "onnxruntime>=1.30.0",
    "numpy>=2",
]

[tool.pytest.ini_options]
# Scope collection to tests/ (git-ignored notebooks/scratch/ files may launch a browser on import).
testpaths = ["tests"]
asyncio_mode = "strict"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PL", "PT"]
# Notebooks are not linted here (they are not in src/ or tests/); the old ast-exec test suites in
# tests/discovery/ and tests/replay/ predate these rules and are ported, not edited, step by step
# (see docs/PRODUCTIONIZE_PLAN.md section 6: each old test file is deleted when its code is ported).
[tool.ruff.lint.per-file-ignores]
"tests/discovery/*" = ["B023", "E501", "I001", "PLC0415", "PLR0913", "PLR0917", "PLR2004", "PT018"]
"tests/replay/*" = ["B007", "E501", "I001", "PLC0415", "PLR2004", "PT018"]
# Not yet ported (test_models.py -> unit/test_llm.py per the plan's table); not touched here.
"tests/test_models.py" = ["PLC0415", "PLR2004", "PT011"]
# src/cua is out of scope for step 0 (owned by later migration steps); the single pre-existing
# PLW0603 (an intentional process-wide "print the fallback notice once" flag) predates this lint
# config and is not edited here.
"src/cua/models.py" = ["PLW0603"]

[tool.black]
line-length = 100

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["cv2.*", "rapidocr.*", "onnxruntime.*", "deepagents.*", "langchain_typesafe.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# LangChain's @tool decorator and middleware generics are untyped.
module = ["cua.discovery.agent.*", "cua.discovery.tools.*"]
disallow_untyped_decorators = false
