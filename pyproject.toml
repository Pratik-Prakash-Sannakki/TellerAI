[project]
name = "interface-ai-cua"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.15",
    "langchain>=1.4.2",
    "langchain-anthropic>=1.7.2",
    "playwright>=1.63.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cua"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupytext>=1.19.5",
    "nbstripout>=0.9.1",
    "pytest>=8.0.0",
]
# OCR + image deps for the pure-visual discovery and replay notebooks.
discovery = [
    "rapidocr>=3.9.2",
    "onnxruntime>=1.30.0",
    "numpy>=2",
]

[tool.pytest.ini_options]
# Scope collection to tests/ (git-ignored notebooks/scratch/ files may launch a browser on import).
testpaths = ["tests"]
